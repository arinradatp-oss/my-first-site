<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เว็บแรกของฉัน</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; }
    button { margin-top: 8px; padding: 10px 16px; font-size: 16px; }
    li { padding: 6px 0; border-bottom: 1px solid #ddd; }
    #status { color: #b00; }
  </style>
</head>
<body>
  <h1>สมุดข้อความ</h1>
  <input id="msg" placeholder="พิมพ์ข้อความ...">
  <button id="send">ส่ง</button>
  <p id="status"></p>
  <ul id="list"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://dctgmbzzqmtezojuihto.supabase.co",
      "sb_publishable_UxGKykanom6yFc5ApwdmCQ_ylCx3a0s"
    );
    const list = document.getElementById("list");
    const status = document.getElementById("status");
    const input = document.getElementById("msg");

    async function load() {
      const { data, error } = await db
        .from("messages")
        .select("*")
        .order("created_at", { ascending: false });
      if (error) { status.textContent = error.message; return; }
      list.innerHTML = "";
      data.forEach(row => {
        const li = document.createElement("li");
        li.textContent = row.text;
        list.appendChild(li);
      });
    }

    document.getElementById("send").onclick = async () => {
      const text = input.value.trim();
      if (!text) return;
      const { error } = await db.from("messages").insert({ text });
      if (error) { status.textContent = error.message; return; }
      status.textContent = "";
      input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
